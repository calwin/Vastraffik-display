<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Västtrafik Departures</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d1117;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            max-width: 100vw;
            padding: 25px 40px;
        }

        .header {
            background: linear-gradient(135deg, #161b22 0%, #1c2128 100%);
            border-radius: 12px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid #30363d;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #58a6ff;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
        }

        .current-time {
            font-size: 2.8rem;
            font-weight: 300;
            color: #ffffff;
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
            letter-spacing: 2px;
        }

        .updated {
            font-size: 0.85rem;
            color: #8b949e;
            text-align: center;
            opacity: 0.7;
        }

        .departures-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: #161b22;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .departures-table th {
            background: linear-gradient(135deg, #1f6feb 0%, #1a5ad7 100%);
            color: #fff;
            padding: 14px 18px;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 2px solid #0d1117;
        }

        .departures-table th:first-child { padding-left: 25px; }
        .departures-table th:last-child { padding-right: 25px; }

        .departures-table td {
            padding: 16px 18px;
            font-size: 1.15rem;
            border-bottom: 1px solid #21262d;
            transition: all 0.2s ease;
        }

        .departures-table td:first-child { padding-left: 25px; }
        .departures-table td:last-child { padding-right: 25px; }

        .departures-table tbody tr {
            background: #0d1117;
        }

        .departures-table tbody tr:hover {
            background: #161b22;
            transform: scale(1.005);
        }

        .departures-table tbody tr:last-child td {
            border-bottom: none;
        }

        .transport-icon {
            font-size: 1.4rem;
            margin-right: 8px;
            vertical-align: middle;
        }

        .line {
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 6px;
            display: inline-block;
            min-width: 45px;
            text-align: center;
            border: 2px solid;
            font-size: 1.05rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            vertical-align: middle;
            /* Colors applied dynamically from API */
        }

        .direction {
            color: #e6edf3;
            font-weight: 400;
        }

        .time {
            font-weight: 700;
            color: #3fb950;
            min-width: 70px;
            display: inline-block;
            font-size: 1.1rem;
        }

        .time.delayed {
            color: #f85149;
        }

        .time.cancelled {
            color: #d73a49;
            text-decoration: line-through;
        }

        .actual-time {
            font-weight: 600;
            color: #e6edf3;
            font-size: 1.15rem;
            font-family: 'SF Mono', 'Consolas', monospace;
        }

        .actual-time.delayed {
            color: #ff9933;
        }

        .track {
            color: #c9d1d9;
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #21262d 0%, #30363d 100%);
            padding: 6px 12px;
            border-radius: 6px;
            display: inline-block;
            min-width: 35px;
            text-align: center;
            border: 1px solid #30363d;
            box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.05);
        }

        .status-badge {
            font-size: 0.75rem;
            color: #f85149;
            margin-left: 6px;
            opacity: 0.9;
            font-weight: 500;
        }

        .error {
            text-align: center;
            color: #ff4444;
            font-size: 1.3rem;
            padding: 40px;
        }

        .loading {
            text-align: center;
            color: #0098db;
            font-size: 1.5rem;
            padding: 60px;
        }

        /* Animation for updates */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .departures-table tbody {
            animation: fadeIn 0.5s ease-in;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <h1 id="stop-name">Departures</h1>
                <div class="current-time" id="current-time">--:--</div>
            </div>
            <div class="updated" id="updated">Loading...</div>
        </div>

        <div id="content">
            <div class="loading">Loading departures...</div>
        </div>
    </div>

    <script>
        const REFRESH_INTERVAL = 600000; // 10 minutes (600 seconds)

        function updateCurrentTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('current-time').textContent = `${hours}:${minutes}`;
        }

        async function fetchDepartures() {
            try {
                const response = await fetch('/api/departures');
                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                    return;
                }

                displayDepartures(data.departures);
                document.getElementById('stop-name').textContent = data.stop_name || 'Departures';
                document.getElementById('current-time').textContent = data.current_time;
                document.getElementById('updated').textContent = `Last updated: ${data.updated}`;

            } catch (error) {
                showError('Failed to fetch departures: ' + error.message);
            }
        }

        function displayDepartures(departures) {
            if (!departures || departures.length === 0) {
                document.getElementById('content').innerHTML = '<div class="error">No departures found</div>';
                return;
            }

            let html = `
                <table class="departures-table">
                    <thead>
                        <tr>
                            <th>Line</th>
                            <th>Direction</th>
                            <th>In</th>
                            <th>Time</th>
                            <th>Track</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            departures.forEach(dep => {
                const statusClass = dep.status === 'delayed' ? 'delayed' : (dep.status === 'cancelled' ? 'cancelled' : '');
                const statusBadge = dep.status === 'delayed' ? '<span class="status-badge">(delayed)</span>' : '';

                // Use API colors with inline styles
                const lineStyle = `background-color: ${dep.bg_color}; color: ${dep.fg_color}; border-color: ${dep.border_color};`;

                // Get transport icon
                const transportIcon = dep.transport_mode === 'tram' ? '🚊' : '🚌';

                html += `
                    <tr>
                        <td><span class="transport-icon">${transportIcon}</span> <span class="line" style="${lineStyle}">${dep.line}</span></td>
                        <td class="direction">${dep.direction}</td>
                        <td><span class="time ${statusClass}">${dep.relative_time}</span>${statusBadge}</td>
                        <td><span class="actual-time ${statusClass}">${dep.actual_time}</span></td>
                        <td class="track">${dep.track}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            document.getElementById('content').innerHTML = html;
        }

        function showError(message) {
            document.getElementById('content').innerHTML = `<div class="error">${message}</div>`;
        }

        // Initial fetch
        updateCurrentTime();
        fetchDepartures();

        // Update time every minute
        setInterval(updateCurrentTime, 60000);

        // Auto-refresh departures every 10 minutes
        setInterval(fetchDepartures, REFRESH_INTERVAL);
    </script>
</body>
</html>
